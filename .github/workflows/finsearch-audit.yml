name: One-click FinSearch Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "audit/**"
      - "advanced_rag/**"
      - "game_qa_agent/**"
      - "finagent_platform/**"
      - "requirements-platform.txt"
      - "temporal_clash/**"
      - "reproduce.py"
      - "docs/REPRODUCIBILITY.md"
      - "README.md"
      - "site/**"
      - "research_workbench/**"
      - "scripts/build_product_site.py"
      - "scripts/evaluate_workbench.py"
      - "scripts/evaluate_terminal*.py"
      - "scripts/replay_pit_gate.py"
      - "scripts/verify_terminal_release.py"
      - "evals/terminal/**"
      - "evals/workbench/**"
      - "pit_benchmark/**"
      - "scripts/verify_pit_release.py"
      - "requirements-workbench.txt"
      - ".github/workflows/finsearch-audit.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install platform API dependencies
        run: python -m pip install -r requirements-platform.txt -r requirements-workbench.txt 'fakeredis[lua]>=2.26,<3'
      - name: Verify product backend
        run: python -m unittest discover -s research_workbench -p 'test_*.py' -v
      - name: Terminal independent financial evaluation
        run: |
          python -m unittest discover -s evals/terminal -p 'test_*.py' -v
          python scripts/evaluate_terminal.py --split all --label pages-regression --output build/quality/terminal-pages.json --require-no-regression docs/verification/terminal-structured-first.json
          python scripts/verify_terminal_release.py
          python scripts/replay_pit_gate.py --verify
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Terminal natural language intent regression
        run: |
          python scripts/evaluate_terminal_nlq.py --split all --label pages-regression --output build/quality/terminal-nlq-pages.json --require-no-regression docs/verification/terminal-nlq-first.json
          python scripts/check_terminal_parity.py --output build/quality/terminal-parity-pages.json
      - name: Verify PIT fixture and scoring without model calls
        run: |
          python -m unittest discover -s pit_benchmark -p 'test_*.py' -v
          python scripts/verify_pit_release.py
      - name: Run offline unit tests
        run: >-
          python -m unittest
          temporal_clash.test_detector
          temporal_clash.test_live_agent
          temporal_clash.test_atlas_compute
          temporal_clash.test_atlas_xbrl
          temporal_clash.test_pit_audit
          advanced_rag.test_advanced_rag
          advanced_rag.test_agentic_eval
          game_qa_agent.test_game_qa_agent
          finagent_platform.test_platform -v
      - name: Reproduce and validate audit
        run: python scripts/build_product_site.py
      - name: Independent financial quality regression
        run: |
          python -m unittest discover -s evals/workbench -p 'test_*.py' -v
          python scripts/evaluate_workbench.py --split all --output build/quality/pages-evaluation.json --require-no-regression docs/verification/workbench-quality-v2-first.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/public
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
