name: One-click FinSearch Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "audit/**"
      - "advanced_rag/**"
      - "game_qa_agent/**"
      - "finagent_platform/**"
      - "requirements-platform.txt"
      - "temporal_clash/**"
      - "reproduce.py"
      - "docs/REPRODUCIBILITY.md"
      - "README.md"
      - "site/**"
      - "research_workbench/**"
      - "scripts/build_product_site.py"
      - "requirements-workbench.txt"
      - ".github/workflows/finsearch-audit.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install platform API dependencies
        run: python -m pip install -r requirements-platform.txt -r requirements-workbench.txt
      - name: Verify product backend
        run: python -m unittest discover -s research_workbench -p 'test_*.py' -v
      - name: Run offline unit tests
        run: >-
          python -m unittest
          temporal_clash.test_detector
          temporal_clash.test_live_agent
          temporal_clash.test_atlas_compute
          temporal_clash.test_atlas_xbrl
          temporal_clash.test_pit_audit
          advanced_rag.test_advanced_rag
          advanced_rag.test_agentic_eval
          game_qa_agent.test_game_qa_agent
          finagent_platform.test_platform -v
      - name: Reproduce and validate audit
        run: python scripts/build_product_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/public
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
