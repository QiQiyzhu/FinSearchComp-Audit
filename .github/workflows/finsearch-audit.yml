name: One-click FinSearch Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "audit/**"
      - ".github/workflows/finsearch-audit.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate audit report
        run: python audit/run_demo.py --output site
      - name: Validate required artifacts
        run: |
          test -s site/index.html
          test -s site/report.md
          test -s site/trace.json
          test -s site/metrics.csv
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
