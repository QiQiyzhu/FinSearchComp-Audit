name: FinAgent Workbench checks

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-workbench.txt -r requirements-platform.txt
      - name: Financial invariants and API lifecycle
        run: python -m unittest discover -s research_workbench -p 'test_*.py' -v
      - name: PIT fixture and scoring without model calls
        run: |
          python -m unittest discover -s pit_benchmark -p 'test_*.py' -v
          python scripts/verify_pit_release.py
      - name: Existing research regression
        run: python -m unittest temporal_clash.test_atlas_xbrl temporal_clash.test_pit_audit finagent_platform.test_platform -v
      - name: Independent scorer integrity
        run: python -m unittest discover -s evals/workbench -p 'test_*.py' -v
      - name: Frozen financial questions must not regress
        run: python scripts/evaluate_workbench.py --split all --output build/quality/ci-evaluation.json --require-no-regression docs/verification/workbench-quality-v2-first.json
      - name: Terminal atomic financial evaluation
        run: |
          python -m unittest discover -s evals/terminal -p 'test_*.py' -v
          python scripts/evaluate_terminal.py --split all --label ci-regression --output build/quality/terminal-ci.json --require-no-regression docs/verification/terminal-structured-first.json
          python scripts/verify_terminal_release.py
          python scripts/replay_pit_gate.py --verify
      - name: Reproduce research and build product website
        run: python scripts/build_product_site.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Terminal natural language intent evaluation
        run: |
          python scripts/evaluate_terminal_nlq.py --split all --label ci-regression --output build/quality/terminal-nlq-ci.json --require-no-regression docs/verification/terminal-nlq-first.json
          python scripts/check_terminal_parity.py --output build/quality/terminal-parity-ci.json
      - run: npx playwright install --with-deps chromium
      - name: Browser journey, static replay and mobile layout
        run: npm test
      - name: Build and start container
        run: |
          docker compose up --build -d --wait
          python scripts/smoke_workbench.py --base-url http://127.0.0.1:8090
          docker compose down
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workbench-browser-report
          path: test-results/
