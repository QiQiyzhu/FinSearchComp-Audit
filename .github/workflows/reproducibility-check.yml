name: Reproducibility check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "audit/**"
      - "reproduce.py"
      - "docs/REPRODUCIBILITY.md"
      - ".github/workflows/reproducibility-check.yml"
  push:
    branches-ignore: [main]
    paths:
      - "audit/**"
      - "reproduce.py"
      - "docs/REPRODUCIBILITY.md"
      - ".github/workflows/reproducibility-check.yml"

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Reproduce report and validate evidence structure
        run: python reproduce.py --output build/site
      - name: Show generated artifacts
        run: |
          find build/site -maxdepth 1 -type f -printf "%f %s bytes\n" | sort
